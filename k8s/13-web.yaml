# Account registration web UI. NodePort 30080 is mapped to host port 8080 in k8s/kind/config.yaml.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: wakaikami
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: wakaikami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: wakaikami/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: ConnectionStrings__Login
              valueFrom:
                secretKeyRef:
                  name: wakaikami-config
                  key: connectionstring-login
            - name: PasswordHashing__Pepper
              valueFrom:
                secretKeyRef:
                  name: wakaikami-config
                  key: pepper
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
