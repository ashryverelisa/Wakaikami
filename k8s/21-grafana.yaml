# Grafana with a provisioned Prometheus datasource and a starter dashboard.
# NodePort 30300 is mapped to host port 3000 in k8s/kind/config.yaml (cluster recreate needed
# if it predates that mapping). Login is disabled for local development (anonymous admin).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: wakaikami
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: wakaikami
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: wakaikami
        folder: Wakaikami
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: wakaikami
data:
  wakaikami.json: |
    {
      "uid": "wakaikami-overview",
      "title": "Wakaikami Overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Aktive Sessions",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "wakaikami_network_sessions_active",
              "legendFormat": "{{job}}/{{manager}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Online-Charaktere (Zone)",
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "wakaikami_zone_characters_online" }]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Push-Stream-Drops (5m)",
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(increase(wakaikami_grpc_push_drops_total[5m]))"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Pakete/s nach Handler-Typ",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (job, handler_type) (rate(wakaikami_network_packets_handled_total[1m]))",
              "legendFormat": "{{job}}/{{handler_type}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Packet-Handler-Dauer p95",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (job, le) (rate(wakaikami_network_packet_duration_seconds_bucket[5m])))",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Update-Tick-Dauer p95 / p99 (Budget 200ms)",
          "gridPos": { "x": 0, "y": 16, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (job, le) (rate(wakaikami_core_update_tick_duration_seconds_bucket[5m])))",
              "legendFormat": "{{job}} p95"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (job, le) (rate(wakaikami_core_update_tick_duration_seconds_bucket[5m])))",
              "legendFormat": "{{job}} p99"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Tick-Overruns & Handler-Fehler (5m)",
          "gridPos": { "x": 12, "y": 16, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (job) (increase(wakaikami_core_update_tick_overruns_total[5m]))",
              "legendFormat": "{{job}} overruns"
            },
            {
              "expr": "sum by (job) (increase(wakaikami_network_packets_errors_total[5m]))",
              "legendFormat": "{{job}} packet errors"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Login-Versuche & Registrierungen (5m)",
          "gridPos": { "x": 0, "y": 24, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (result) (increase(wakaikami_login_attempts_total[5m]))",
              "legendFormat": "login {{result}}"
            },
            {
              "expr": "sum by (result) (increase(wakaikami_web_registrations_total[5m]))",
              "legendFormat": "registration {{result}}"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Zone-Disconnects nach Grund (5m)",
          "gridPos": { "x": 12, "y": 24, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (reason) (increase(wakaikami_zone_disconnects_total[5m]))",
              "legendFormat": "{{reason}}"
            }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: wakaikami
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: wakaikami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.0.2
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
