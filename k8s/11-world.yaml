# Cluster-internal gRPC endpoint; name must stay in sync with the world cert SANs and
# Grpc__WorldEndpoint on the zone service.
apiVersion: v1
kind: Service
metadata:
  name: world-service
  namespace: wakaikami
spec:
  selector:
    app: world
  ports:
    - name: grpc
      port: 8510
      targetPort: 8510
    - name: metrics
      port: 9464
      targetPort: 9464
---
# Game client entry point (TCP). NodePort 30120 is mapped to host port 9120 in k8s/kind/config.yaml.
# World__WorldInfo__ConnectIP below is the address advertised to game clients and must resolve to
# this port mapping from the player's machine.
apiVersion: v1
kind: Service
metadata:
  name: world-game
  namespace: wakaikami
spec:
  type: NodePort
  selector:
    app: world
  ports:
    - name: game
      port: 9120
      targetPort: 9120
      nodePort: 30120
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: world
  namespace: wakaikami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: world
  template:
    metadata:
      labels:
        app: world
    spec:
      containers:
        - name: world
          image: wakaikami/world-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 8510
            - name: game
              containerPort: 9120
            - name: metrics
              containerPort: 9464
          env:
            - name: ConnectionStrings__World
              valueFrom:
                secretKeyRef:
                  name: wakaikami-config
                  key: connectionstring-world
            - name: Grpc__LoginEndpoint
              value: https://login-service:8500
            - name: World__WorldInfo__ConnectIP
              value: "127.0.0.1"
            - name: WAKAIKAMI_CERT_DIR
              value: /certs
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: certs
          secret:
            secretName: wakaikami-certs
