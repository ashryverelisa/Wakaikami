# Prometheus scraping the /metrics endpoints of all Wakaikami services.
# UI reachable via: kubectl -n wakaikami port-forward svc/prometheus 9090
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: wakaikami
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: login
        static_configs:
          - targets: ["login-service:9464"]
      - job_name: world
        static_configs:
          - targets: ["world-service:9464"]
      - job_name: zone
        static_configs:
          - targets: ["zone-metrics:9464"]
      - job_name: web
        static_configs:
          - targets: ["web:8080"]
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: wakaikami
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: wakaikami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=2d
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: prometheus-config
