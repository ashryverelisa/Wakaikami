# DEV-ONLY values for local clusters (kind / Docker Desktop). For anything shared or public,
# create this secret out-of-band and never commit real credentials.
#
# The gRPC mTLS certs live in a separate secret ("wakaikami-certs") created from src/certs:
#   kubectl -n wakaikami create secret generic wakaikami-certs --from-file=src/certs
# (scripts/deploy-kind.ps1 does this automatically)
apiVersion: v1
kind: Secret
metadata:
  name: wakaikami-config
  namespace: wakaikami
type: Opaque
stringData:
  sa-password: "Wakaikami#Dev2026"
  connectionstring-login: "Server=mssql;Database=Login;User Id=sa;Password=Wakaikami#Dev2026;TrustServerCertificate=True;MultipleActiveResultSets=True;"
  connectionstring-world: "Server=mssql;Database=World;User Id=sa;Password=Wakaikami#Dev2026;TrustServerCertificate=True;MultipleActiveResultSets=True;"
  pepper: "2407711aa923c43cc292c4e447baf9e8ae6987d8e0d8df68218735ad918f7ef8"
